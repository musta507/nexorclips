<div class="inline" style="flex-wrap:wrap">
  {% if s.status != 'aprobado' %}
  <form class="inline" method="post" action="{{ url_for('admin_review', sid=s.id, accion='aprobar') }}"{% if s.flag_list %} data-confirm="Este clip tiene avisos ({{ s.flag_list|map('replace', '_', ' ')|join(', ') }}). ¿Aprobarlo igualmente?"{% endif %}>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <button class="btn sm green" data-key-approve{% if not account_verified(s) %} disabled title="Acepta primero la cuenta del clipper en esta campaña"{% endif %}>Aprobar</button>
  </form>
  {% endif %}
  {% if s.status != 'rechazado' %}
  <form class="inline rj" method="post" action="{{ url_for('admin_review', sid=s.id, accion='rechazar') }}"{% if s.status == 'aprobado' %} data-confirm="Este clip ya está aprobado y tiene {{ s.earned|money }} asignados. Si lo rechazas, se le quitarán. ¿Seguir?"{% endif %}>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <select name="code" aria-label="Motivo del rechazo" data-key-reject>
      {% for k, label in REJECT_REASONS.items() %}<option value="{{ k }}">{{ label }}</option>{% endfor %}
    </select>
    <input name="reason" placeholder="Mensaje (opcional)" style="width:150px" aria-label="Mensaje para el clipper">
    <button class="btn sm red">Rechazar</button>
  </form>
  {% endif %}
  {% if s.flag_list %}
  <form class="inline" method="post" action="{{ url_for('admin_review', sid=s.id, accion='quitar_avisos') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn sm soft" title="Quitar los avisos de este clip">Quitar avisos</button>
  </form>
  {% endif %}
</div>
